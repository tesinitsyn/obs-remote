<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OBS Clip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg1: #0f2027;
            --bg2: #203a43;
            --bg3: #2c5364;
            --accent: #ff3d3d;
            --accent-glow: rgba(255, 61, 61, 0.8);
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text);
        }

        .container {
            text-align: center;
            padding: 24px;
        }

        h1 {
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .clip-btn {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at top, #ff6b6b, var(--accent));
            color: white;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                    0 0 30px var(--accent-glow),
                    inset 0 -10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .clip-btn:active {
            transform: scale(0.95);
            box-shadow:
                    0 0 15px var(--accent-glow),
                    inset 0 -5px 10px rgba(0,0,0,0.4);
        }

        .status {
            margin-top: 30px;
            font-size: 18px;
            opacity: 0.85;
            height: 24px;
        }

        /* ❄️ Snow */
        .snow {
            position: absolute;
            top: -10px;
            color: white;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎄 OBS CLIP 🎬</h1>

    <button class="clip-btn" onclick="makeClip()">
        CLIP
    </button>

    <div class="status" id="status"></div>
</div>

<script>
    function makeClip() {
        const status = document.getElementById("status");
        status.textContent = "🎥 Клип сохранён";

        fetch('/clip', { method: 'POST' })
            .catch(() => status.textContent = "❌ Ошибка");

        setTimeout(() => status.textContent = "", 2000);
    }

    // ❄️ Snow generator
    const snowCount = 30;

    for (let i = 0; i < snowCount; i++) {
        const snow = document.createElement("div");
        snow.className = "snow";
        snow.textContent = "❄";
        snow.style.left = Math.random() * 100 + "vw";
        snow.style.fontSize = (12 + Math.random() * 24) + "px";
        snow.style.animationDuration = (5 + Math.random() * 10) + "s";
        snow.style.animationDelay = Math.random() * 5 + "s";
        document.body.appendChild(snow);
    }
</script>

</body>
</html>
